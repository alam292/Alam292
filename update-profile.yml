name: Auto Update Profile

on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours
  workflow_dispatch:              # manual "Run workflow" button
  push:
    paths:                        # runs automatically on your first push
      - "scripts/update_profile.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub data and regenerate README + SVG graphs
        env:
          # Optional: add a PAT named GH_PAT (scope: read:user) to count private contributions too
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_profile.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "🤖 Auto-update profile: chess, Pac-Man & stats graphs"
          git push
